<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (() => {
      const savedTheme = localStorage.getItem('0xthac0-theme')
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.dataset.theme = theme
    })()
  </script>
  <!--
    Social preview tags. `scripts/emit-social-html.mjs` replaces everything between
    these markers per route after `vite build`, so crawlers that never run JS still
    get per-post Open Graph and Twitter cards. Keep the markers intact.
  -->
  <!-- social-meta:start -->
  <title>0xthac0 | Portfolio</title>
  <meta name="description"
    content="Engineer, systems thinker, and interface craftsperson. Product systems, resilient frontends, shaders, and AI-assisted workflows — written up with an editorial eye." />
  <link rel="canonical" href="https://0xthac0.github.io/" />
  <meta property="og:site_name" content="0xthac0" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://0xthac0.github.io/" />
  <meta property="og:title" content="0xthac0 | Portfolio" />
  <meta property="og:description"
    content="Engineer, systems thinker, and interface craftsperson. Product systems, resilient frontends, shaders, and AI-assisted workflows — written up with an editorial eye." />
  <meta property="og:image" content="https://0xthac0.github.io/media/social/default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="0xthac0 | Portfolio" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="0xthac0 | Portfolio" />
  <meta name="twitter:description"
    content="Engineer, systems thinker, and interface craftsperson. Product systems, resilient frontends, shaders, and AI-assisted workflows — written up with an editorial eye." />
  <meta name="twitter:image" content="https://0xthac0.github.io/media/social/default.jpg" />
  <meta name="twitter:image:alt" content="0xthac0 | Portfolio" />
  <!-- social-meta:end -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
